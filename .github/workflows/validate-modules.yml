name: Validate Apex Logistic Group modules
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript module syntax
        run: |
          node --check .github/scripts/weekly-report.cjs
          for file in app.js modules/*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
