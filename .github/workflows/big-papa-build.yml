name: Big Papa build
on:
  push:
    branches: [apex-react-springboot-v1]
    paths:
      - 'big-papa/**'
      - '.github/workflows/big-papa-build.yml'
  pull_request:
    paths:
      - 'big-papa/**'
      - '.github/workflows/big-papa-build.yml'
  workflow_dispatch:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: big-papa/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: big-papa/frontend/package-lock.json
      - run: npm install
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: big-papa/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode test
